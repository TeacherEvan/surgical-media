name: Skill CI

# NOTE: this account is billing-locked; runs start again when it is unlocked.
# The identical gate suite is mirrored on GitLab (see .gitlab-ci.yml) — both
# call scripts/ci_gates.sh so they cannot drift apart.
"on":
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff pillow jsonschema check-jsonschema
          sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run the gate suite (scripts/ci_gates.sh)
        run: bash scripts/ci_gates.sh
