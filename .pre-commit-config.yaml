# Optional local pre-commit hooks — mirrors the local gate, does NOT replace it.
# Install:  pip install pre-commit && pre-commit install
# The authoritative check remains:  PATH=<venv>/bin:$PATH bash scripts/ci_gates.sh
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff
        args: [--no-cache]
      - id: ruff-format
        args: [--no-cache]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
  # Strict typecheck — mirrors `python3 -m mypy scripts/` in scripts/ci_gates.sh.
  # `language: system` uses the python on PATH (install requirements-dev.txt first).
  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict (pyproject.toml config)
        entry: python -m mypy scripts/
        language: system
        pass_filenames: false
