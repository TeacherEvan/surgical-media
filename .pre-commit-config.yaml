# Optional local pre-commit hooks — mirrors the local gate, does NOT replace it.
# Install:  pip install pre-commit && pre-commit install
# The authoritative check remains:  PATH=<venv>/bin:$PATH bash scripts/ci_gates.sh
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff
        args: [--no-cache]
      - id: ruff-format
        args: [--no-cache]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
