<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <radialGradient id="washPeach" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F4CFC0" stop-opacity="0.48"/>
      <stop offset="60%" stop-color="#F6DDD2" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FBF6EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="washSage" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C8DACB" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#DCE8DD" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FBF6EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leafSage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B9CEB9"/>
      <stop offset="100%" stop-color="#89A48D"/>
    </linearGradient>
    <linearGradient id="leafMint" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CEDED0"/>
      <stop offset="100%" stop-color="#9EB6A1"/>
    </linearGradient>
    <linearGradient id="petalBlush" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5EE"/>
      <stop offset="55%" stop-color="#F5D3C8"/>
      <stop offset="100%" stop-color="#E7B7A8"/>
    </linearGradient>
    <linearGradient id="goldHair" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8A267" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#C8A267" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#C8A267" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- Soft watercolor atmosphere washes -->
  <ellipse cx="220" cy="140" rx="260" ry="180" fill="url(#washSage)" filter="url(#softBlur)"/>
  <ellipse cx="1060" cy="580" rx="280" ry="190" fill="url(#washPeach)" filter="url(#softBlur)"/>

  <!-- Editorial fine double frame -->
  <rect x="44" y="36" width="1192" height="648" rx="18" fill="none" stroke="#CDB494" stroke-opacity="0.42" stroke-width="1.4"/>
  <rect x="54" y="46" width="1172" height="628" rx="13" fill="none" stroke="#D8C6B0" stroke-opacity="0.28" stroke-width="0.9"/>

  <!-- Top-left graceful olive & almond blossom branch -->
  <g transform="translate(46, 38)" opacity="0.92">
    <path d="M -10,165 C 75,115 165,70 285,48 C 365,34 435,28 495,38" fill="none" stroke="#9B8574" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 118,96 C 145,126 185,150 238,158" fill="none" stroke="#A6907F" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 250,56 C 282,82 325,92 372,88" fill="none" stroke="#A6907F" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Sage olive leaves -->
    <path d="M 64,126 C 48,92 72,62 104,70 C 96,102 82,118 64,126 Z" fill="url(#leafSage)" opacity="0.88"/>
    <path d="M 96,110 C 118,136 106,172 78,168 C 74,142 84,122 96,110 Z" fill="url(#leafMint)" opacity="0.85"/>
    <path d="M 152,82 C 148,46 182,24 206,42 C 192,68 172,78 152,82 Z" fill="url(#leafSage)" opacity="0.90"/>
    <path d="M 218,62 C 232,26 268,14 288,36 C 266,56 240,62 218,62 Z" fill="url(#leafMint)" opacity="0.88"/>
    <path d="M 315,44 C 336,16 376,12 390,34 C 365,48 338,48 315,44 Z" fill="url(#leafSage)" opacity="0.85"/>
    <path d="M 398,35 C 425,14 462,18 470,38 C 444,46 418,42 398,35 Z" fill="url(#leafMint)" opacity="0.82"/>
    <path d="M 176,136 C 202,116 238,128 242,154 C 214,158 190,148 176,136 Z" fill="url(#leafSage)" opacity="0.82"/>
    <path d="M 294,82 C 322,68 358,76 364,98 C 336,102 310,94 294,82 Z" fill="url(#leafMint)" opacity="0.82"/>

    <!-- Delicate blush almond blossoms -->
    <g transform="translate(132, 92) scale(0.95)">
      <ellipse cx="0" cy="-16" rx="10" ry="15" fill="url(#petalBlush)"/>
      <ellipse cx="15" cy="-5" rx="10" ry="15" transform="rotate(72 15 -5)" fill="url(#petalBlush)"/>
      <ellipse cx="9" cy="13" rx="10" ry="15" transform="rotate(144 9 13)" fill="url(#petalBlush)"/>
      <ellipse cx="-9" cy="13" rx="10" ry="15" transform="rotate(216 -9 13)" fill="url(#petalBlush)"/>
      <ellipse cx="-15" cy="-5" rx="10" ry="15" transform="rotate(288 -15 -5)" fill="url(#petalBlush)"/>
      <circle cx="0" cy="0" r="5.5" fill="#DFB871"/>
    </g>
    <g transform="translate(268, 52) scale(0.78)">
      <ellipse cx="0" cy="-15" rx="9" ry="14" fill="url(#petalBlush)"/>
      <ellipse cx="14" cy="-4" rx="9" ry="14" transform="rotate(72 14 -4)" fill="url(#petalBlush)"/>
      <ellipse cx="8" cy="12" rx="9" ry="14" transform="rotate(144 8 12)" fill="url(#petalBlush)"/>
      <ellipse cx="-8" cy="12" rx="9" ry="14" transform="rotate(216 -8 12)" fill="url(#petalBlush)"/>
      <ellipse cx="-14" cy="-4" rx="9" ry="14" transform="rotate(288 -14 -4)" fill="url(#petalBlush)"/>
      <circle cx="0" cy="0" r="4.8" fill="#DFB871"/>
    </g>
    <g transform="translate(460, 42) scale(0.58)">
      <ellipse cx="0" cy="-14" rx="9" ry="13" fill="url(#petalBlush)"/>
      <ellipse cx="13" cy="-4" rx="9" ry="13" transform="rotate(72 13 -4)" fill="url(#petalBlush)"/>
      <ellipse cx="8" cy="11" rx="9" ry="13" transform="rotate(144 8 11)" fill="url(#petalBlush)"/>
      <ellipse cx="-8" cy="11" rx="9" ry="13" transform="rotate(216 -8 11)" fill="url(#petalBlush)"/>
      <ellipse cx="-13" cy="-4" rx="9" ry="13" transform="rotate(288 -13 -4)" fill="url(#petalBlush)"/>
      <circle cx="0" cy="0" r="4.5" fill="#DFB871"/>
    </g>
  </g>

  <!-- Bottom-right mirrored olive & almond blossom branch -->
  <g transform="translate(1234, 682) rotate(180)" opacity="0.92">
    <path d="M -10,165 C 75,115 165,70 285,48 C 365,34 435,28 495,38" fill="none" stroke="#9B8574" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 118,96 C 145,126 185,150 238,158" fill="none" stroke="#A6907F" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 64,126 C 48,92 72,62 104,70 C 96,102 82,118 64,126 Z" fill="url(#leafSage)" opacity="0.88"/>
    <path d="M 96,110 C 118,136 106,172 78,168 C 74,142 84,122 96,110 Z" fill="url(#leafMint)" opacity="0.85"/>
    <path d="M 152,82 C 148,46 182,24 206,42 C 192,68 172,78 152,82 Z" fill="url(#leafSage)" opacity="0.90"/>
    <path d="M 218,62 C 232,26 268,14 288,36 C 266,56 240,62 218,62 Z" fill="url(#leafMint)" opacity="0.88"/>
    <path d="M 315,44 C 336,16 376,12 390,34 C 365,48 338,48 315,44 Z" fill="url(#leafSage)" opacity="0.85"/>
    <path d="M 176,136 C 202,116 238,128 242,154 C 214,158 190,148 176,136 Z" fill="url(#leafSage)" opacity="0.82"/>
    <g transform="translate(132, 92) scale(0.95)">
      <ellipse cx="0" cy="-16" rx="10" ry="15" fill="url(#petalBlush)"/>
      <ellipse cx="15" cy="-5" rx="10" ry="15" transform="rotate(72 15 -5)" fill="url(#petalBlush)"/>
      <ellipse cx="9" cy="13" rx="10" ry="15" transform="rotate(144 9 13)" fill="url(#petalBlush)"/>
      <ellipse cx="-9" cy="13" rx="10" ry="15" transform="rotate(216 -9 13)" fill="url(#petalBlush)"/>
      <ellipse cx="-15" cy="-5" rx="10" ry="15" transform="rotate(288 -15 -5)" fill="url(#petalBlush)"/>
      <circle cx="0" cy="0" r="5.5" fill="#DFB871"/>
    </g>
    <g transform="translate(280, 52) scale(0.72)">
      <ellipse cx="0" cy="-15" rx="9" ry="14" fill="url(#petalBlush)"/>
      <ellipse cx="14" cy="-4" rx="9" ry="14" transform="rotate(72 14 -4)" fill="url(#petalBlush)"/>
      <ellipse cx="8" cy="12" rx="9" ry="14" transform="rotate(144 8 12)" fill="url(#petalBlush)"/>
      <ellipse cx="-8" cy="12" rx="9" ry="14" transform="rotate(216 -8 12)" fill="url(#petalBlush)"/>
      <ellipse cx="-14" cy="-4" rx="9" ry="14" transform="rotate(288 -14 -4)" fill="url(#petalBlush)"/>
      <circle cx="0" cy="0" r="4.8" fill="#DFB871"/>
    </g>
  </g>

  <!-- Subtle gold center divider ornaments -->
  <line x1="420" y1="248" x2="860" y2="248" stroke="url(#goldHair)" stroke-width="1.4"/>
  <circle cx="640" cy="248" r="3.5" fill="#CFA665" opacity="0.82"/>
  <line x1="460" y1="472" x2="820" y2="472" stroke="url(#goldHair)" stroke-width="1.4"/>
  <circle cx="640" cy="472" r="3.5" fill="#CFA665" opacity="0.82"/>
</svg>
