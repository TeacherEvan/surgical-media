[project]
name = "surgical-media"
version = "1.3.0"
description = "Deterministic, QC-gated video generation pipeline: storyboard to H.264/yuv420p MP4 via Pillow and FFmpeg."
requires-python = ">=3.10"
license = { text = "MIT" }
# Not published to PyPI — this repo is a Hermes skill, not a library. The [project]
# table exists to declare the dependency floors and tool configuration; the support
# matrix lives in requirements*.txt, which mirrors these values (keep both in sync).
dependencies = ["Pillow>=10.1"]

[project.optional-dependencies]
# edge-tts is an optional user install for the online voice path only (never bundled;
# the offline timing path is stdlib). Tests never exercise it.
tts = ["edge-tts>=6.1"]
# The "gate venv": everything scripts/ci_gates.sh needs beyond the runtime dep.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "jsonschema>=4.21",
    "ruff>=0.6.0",
    "mypy>=1.11",
    "check-jsonschema>=0.28",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
explicit_package_bases = true

[tool.coverage.run]
source = ["scripts"]

[tool.coverage.report]
show_missing = true
