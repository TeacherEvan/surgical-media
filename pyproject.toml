[project]
name = "surgical-media"
version = "1.3.0"
description = "Deterministic, QC-gated video generation pipeline: storyboard to H.264/yuv420p MP4 via Pillow and FFmpeg."
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
